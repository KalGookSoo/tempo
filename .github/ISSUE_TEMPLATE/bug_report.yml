name: 버그 리포트
description: BDD(Given/When/Then) 형식으로 재현/기대/실제 동작을 기술해 버그를 보고하세요.
title: "[버그] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        감사합니다! 이 템플릿은 행위 주도 개발(BDD) 형식에 맞춰 버그를 명확히 기술하도록 돕습니다.
        - 핵심은 "Given/When/Then/But"(기대/실제) 구조입니다.
        - 스크린샷/영상/에러 로그 첨부를 권장합니다.
  - type: input
    id: scenario_title
    attributes:
      label: 시나리오 제목
      description: 어떤 상황의 버그인지 한 줄로 요약하세요.
      placeholder: 예) 인터벌 실행 중 일시정지 후 재개하면 남은 시간이 초기화됨
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 버그가 발생한 화면/기능을 선택하세요.
      options:
        - 타이머(카운트다운/카운트업)
        - 스톱워치
        - 인터벌 실행
        - 인터벌 프로그램 관리(생성/수정/삭제/복제)
        - 알림 큐(사운드/진동/녹음)
        - 기본 제공 프리셋(Tabata/FGB/EMOM)
        - 내비게이션/화면 전환
        - 로컬 저장(SwiftData)/마이그레이션
        - 기타
    validations:
      required: false
  - type: textarea
    id: given
    attributes:
      label: Given(전제 조건)
      description: 버그 재현 전 상태. 어떤 타이머/프리셋을 어떤 설정으로 준비했는지 등.
      placeholder: |
        예)
        - 인터벌 프리셋 "Tabata"(운동 20초/휴식 10초/8라운드)를 선택해 실행 중
        - 3라운드 운동 구간에 진입한 상태
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When(행동)
      description: 사용자가 수행한 구체적 행동을 단계로 작성하세요.
      placeholder: |
        예)
        1) 운동 구간에서 일시정지 버튼 탭
        2) 5초 대기
        3) 재개 버튼 탭
    validations:
      required: true
  - type: textarea
    id: then_expected
    attributes:
      label: Then(기대 결과)
      description: 정상이라면 어떻게 보여야/동작해야 하는지.
      placeholder: |
        예) 일시정지 시점의 남은 시간(예: 12초)부터 이어서 카운트다운이 재개된다.
    validations:
      required: true
  - type: textarea
    id: but_actual
    attributes:
      label: But(실제 결과)
      description: 실제로 관찰된 결과를 정확히 적어 주세요.
      placeholder: |
        예) 재개 시 남은 시간이 20초(구간 시작 시간)로 초기화되어 다시 시작된다.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경 정보
      description: 기기, iOS 버전, 앱 버전(빌드 번호 포함)
      placeholder: |
        - 기기: iPhone 15 Pro
        - iOS 버전: 18.1
        - 앱 버전: tempo v0.1.0 (TestFlight build 12)
        - 화면 미러링 사용 여부: 아니오
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷/영상(선택)
      description: 가능하면 문제를 보여주는 이미지/GIF/영상 링크를 첨부하세요.
      placeholder: 이미지 또는 링크 첨부
  - type: textarea
    id: logs
    attributes:
      label: 관련 로그(선택)
      description: 콘솔 로그, 크래시 로그, 스택 트레이스 등을 붙여넣어 주세요.
  - type: textarea
    id: notes
    attributes:
      label: 가능한 원인/해결 아이디어(선택)
      description: 원인 추정, 가설, 임시 우회 방법, 관련 문서/이슈 링크 등.
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 중복 이슈를 검색했습니다
          required: true
        - label: 재현 절차와 환경 정보를 기입했습니다
          required: true
