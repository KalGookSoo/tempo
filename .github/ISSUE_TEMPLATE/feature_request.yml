name: 기능 요청
description: 새로운 기능/개선을 제안해 주세요.
title: "[기능] "
labels: [enhancement]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 기능 요약
      description: 제안하는 기능을 한두 문장으로 요약해 주세요.
      placeholder: 예) 인터벌 실행 화면에 다음 구간(Fn/Cn) 미리보기를 표시합니다.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      description: 제안이 해당하는 화면/기능을 선택하세요.
      options:
        - 타이머(카운트다운/카운트업)
        - 스톱워치
        - 인터벌 실행
        - 인터벌 프로그램 관리(생성/수정/삭제/복제)
        - 알림 큐(사운드/진동/녹음)
        - 기본 제공 프리셋(Tabata/FGB/EMOM)
        - 내비게이션/화면 전환
        - 로컬 저장(SwiftData)/마이그레이션
        - 화면 미러링/표시 설정
        - 기타
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: 문제/배경
      description: 어떤 문제나 니즈 때문에 이 기능이 필요한가요?
      placeholder: 예) 다음 구간이 뭔지 몰라 운동 중 화면을 계속 주시해야 해서 불편합니다.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방향
      description: 구현 아이디어나 원하는 동작을 간단히 적어 주세요.
      placeholder: 예) 현재 구간 아래에 다음 구간의 라벨(Fn/Cn)과 시간을 작게 표시합니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 기대 효과/가치(선택)
      description: 이 기능이 제공할 사용자 가치는 무엇인가요?
      placeholder: 예) 운동 중 다음 동작을 미리 준비할 수 있어 흐름이 끊기지 않습니다.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 고려했던 대안(선택)
      description: 다른 접근이나 대안이 있었다면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: usecases
    attributes:
      label: 사용 사례/예시(선택)
      description: 실제 사용 시나리오나 화면 흐름 예시가 있으면 적어 주세요.
      placeholder: 예) Tabata 6라운드 진행 중, 5라운드 운동 구간에서 다음 "6라운드 휴식 10초"가 미리 보인다.
    validations:
      required: false
  - type: textarea
    id: docs
    attributes:
      label: 관련 문서(선택)
      description: 관련된 docs/ 문서가 있으면 경로를 적어 주세요(예 docs/timer-functional-spec.md, docs/use-cases/interval-timing.md).
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보(선택)
      description: 관련 링크, 레퍼런스, 첨부 자료 등.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 중복 제안을 검색했습니다
          required: true
        - label: 기능 범위와 기대 효과를 간단히 정리했습니다
          required: true
