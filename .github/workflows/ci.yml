name: CI

# main 브랜치로의 push와 모든 PR에서 빌드/포맷 검사를 자동으로 돌린다.
# 이슈 #72 참고. 유닛 테스트는 CI에 자동화하지 않는다 — 아래 build 잡의
# 주석 참고.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치/PR에 새 커밋이 올라오면 이전 실행은 취소한다 — 오래된 결과가 뒤늦게
# 완료되어 최신 커밋의 상태를 덮어쓰는 일을 막는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-15
    defaults:
      run:
        working-directory: tempo
    steps:
      - uses: actions/checkout@v4

      # 러너 기본 선택 Xcode(이 워크플로를 처음 돌렸을 때 16.4로 확인됨)는 이
      # 프로젝트가 요구하는 버전(로컬 개발 기준 Xcode 26.5)보다 한참 낮다.
      # 러너에 설치된 Xcode 중 가장 최신 버전을 매번 동적으로 골라 쓴다 — 특정
      # 버전을 하드코딩하면 GitHub이 이미지를 갱신할 때마다 다시 손봐야 한다.
      # (그래도 러너 이미지가 아직 26.5까지 못 따라왔을 수 있어 최신이 정확히
      # 26.5가 아닐 수 있다 — 아래 "Show selected Xcode version" 로그로 확인한다.)
      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "Xcode_*.app을 찾지 못해 기본 /Applications/Xcode.app을 그대로 쓴다." >&2
          else
            echo "다음 Xcode를 선택한다: $LATEST"
            sudo xcode-select -s "$LATEST"
          fi

      - name: Show selected Xcode version
        run: xcodebuild -version

      # `generic/platform=iOS Simulator`는 실제 시뮬레이터 기기를 필요로 하지
      # 않는 "컴파일만" 목적의 destination이다 — 특정 기기 이름으로 빌드하려면
      # 그 이름의 시뮬레이터가 "부팅 가능한 상태"(런타임 설치까지 끝난 상태)여야
      # 하는데, GitHub 호스팅 macOS 러너는 기본으로 딸려오는 Xcode 버전이 아닌
      # 다른 버전(`Select latest available Xcode`로 고른 것)에는 시뮬레이터
      # 런타임이 아예 설치돼 있지 않은 경우가 흔하다. 실제로 이 워크플로도 처음엔
      # 특정 기기를 골라 빌드/테스트하려다가 매번 "사용 가능한 iOS 시뮬레이터를
      # 찾지 못했다"로 실패했다 — 러너 이미지의 Xcode 구성에 달린 문제라 CI에서
      # 안정적으로 고칠 수 없었다. 그래서 CI는 컴파일 확인까지만 하고, 실제
      # 시뮬레이터 실행이 필요한 유닛/UI 테스트는 CI에 자동화하지 않는다 —
      # PR을 올리기 전에 로컬에서 `xcodebuild test`로 직접 돌려서 확인한다
      # (CONTRIBUTING.md "풀 리퀘스트 제출" 참고).
      - name: Build
        run: |
          xcodebuild build \
            -project tempo.xcodeproj \
            -scheme tempo \
            -destination 'generic/platform=iOS Simulator'

  lint:
    name: SwiftFormat Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      # .swiftformat 설정(--swiftversion 5.0 --indent 4)을 그대로 따른다.
      # docs/swift-coding-conventions.md 참고.
      - name: Check formatting
        run: swiftformat --lint tempo
