name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Archive & Upload to TestFlight
    runs-on: macos-15
    defaults:
      run:
        working-directory: tempo
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "Xcode_*.app을 찾지 못해 기본 /Applications/Xcode.app을 그대로 쓴다." >&2
          else
            echo "다음 Xcode를 선택한다: $LATEST"
            sudo xcode-select -s "$LATEST"
          fi

      # App Store Connect API 키를 xcodebuild가 찾는 경로에 파일로 복원한다.
      - name: Restore App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # macos-15 러너는 매 실행마다 키체인이 비어 있는 새 VM이라, -allowProvisioningUpdates만
      # 믿고 서명을 맡기면 Xcode가 "쓸 수 있는 인증서가 없다"고 판단해 실행마다 새
      # Apple Distribution 인증서를 만들었다 — 그게 쌓여서 계정의 인증서 개수 한도를
      # 넘겼다("Choose a certificate to revoke" 에러의 원인). 미리 만들어둔 인증서
      # 하나를 매번 같은 걸로 가져와 쓰면 더 이상 새로 만들 필요가 없다.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 기존 로그인 키체인 검색 목록은 유지하고 새 키체인을 추가한다 — 통째로
          # 바꾸면 다른 시스템 인증서를 못 찾아 이후 단계가 깨질 수 있다.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[\"]//g')

          rm "$CERT_PATH"

      # -allowProvisioningUpdates(자동 서명)는 인증서를 키체인에 미리 넣어놔도, 이
      # 번들 ID들에 매칭되는 프로파일을 스스로 못 찾으면 "프로파일도 새로 만들고
      # 거기 쓸 인증서도 새로 만들겠다"는 식으로 처음부터 다시 시도해서 결국 같은
      # 인증서 한도 에러로 돌아왔다. 그래서 서명을 완전히 수동(Manual)으로 바꿨다 —
      # 타겟마다 미리 만들어둔 프로파일을 여기서 직접 설치하고, project.pbxproj의
      # Release 설정(CODE_SIGN_STYLE=Manual)과 exportOptions.plist가 그 프로파일을
      # 이름으로 정확히 지정하므로, 빌드 시점에 Apple에 뭘 만들어달라고 요청할 일
      # 자체가 없어진다.
      - name: Install provisioning profiles
        env:
          PROFILE_TEMPO_BASE64: ${{ secrets.IOS_PROFILE_TEMPO }}
          PROFILE_WATCH_BASE64: ${{ secrets.IOS_PROFILE_WATCH }}
          PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local base64_content="$1"
            local tmp_path="$RUNNER_TEMP/$(uuidgen).mobileprovision"
            echo "$base64_content" | base64 --decode > "$tmp_path"
            local uuid
            uuid=$(security cms -D -i "$tmp_path" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
            cp "$tmp_path" "$PROFILES_DIR/$uuid.mobileprovision"
            rm "$tmp_path"
          }

          install_profile "$PROFILE_TEMPO_BASE64"
          install_profile "$PROFILE_WATCH_BASE64"
          install_profile "$PROFILE_WIDGET_BASE64"

      - name: Archive
        run: |
          xcodebuild archive \
            -project tempo.xcodeproj \
            -scheme tempo \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/tempo.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/tempo.xcarchive" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/.github/exportOptions.plist" \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # 러너는 매번 새 VM이라 어차피 안 남지만, 임시 키체인을 명시적으로 지워서
      # 실패한 실행이라도 뒤처리가 흐지부지되지 않게 한다.
      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
